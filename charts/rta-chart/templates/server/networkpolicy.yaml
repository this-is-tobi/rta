{{- if .Values.enabled }}
{{- range $name, $entry := .Values.servers }}
{{- $s := include "rta.server.values" (dict "root" $ "server" $entry) | fromYaml }}
{{- if and $s.enabled $s.networkPolicy.create }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "rta.serverFullname" (dict "root" $ "name" $name) }}
  labels: {{- include "rta.labels" (dict "root" $ "name" $name) | nindent 4 }}
    {{- with $s.networkPolicy.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $s.networkPolicy.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- /* Required, and never omitted: an absent podSelector defaults to `{}`, which would apply
  these rules to every pod in the namespace instead of this one instance's. In a release that
  deploys one instance per person, that difference is the whole point of the resource. */}}
  podSelector:
    matchLabels: {{- include "rta.selectorLabels" (dict "root" $ "name" $name) | nindent 6 }}
  policyTypes: {{- toYaml $s.networkPolicy.policyTypes | nindent 2 }}
  {{- if $s.networkPolicy.ingress }}
  ingress: {{- toYaml $s.networkPolicy.ingress | nindent 2 }}
  {{- else if has "Ingress" $s.networkPolicy.policyTypes }}
  {{- /* A default that admits the ports this instance actually serves, rather than an empty
  `ingress:` - which under a policy naming the Ingress type means "nothing reaches this pod",
  including the ingress controller, and presents as a working release serving 100% errors. */}}
  ingress:
  - ports:
    - protocol: TCP
      port: {{ $s.containerPort }}
  {{- /* Gated on observability.enabled alone, not also on metrics.enabled: the kubelet's own
  probes hit this port directly by pod IP, whether or not a Service ever publishes it, and a CNI
  that enforces NetworkPolicy against node-sourced traffic would otherwise fail every probe the
  moment this policy is turned on with metrics off - the default. */}}
  {{- if $s.observability.enabled }}
  - ports:
    - protocol: TCP
      port: {{ $s.observability.port }}
  {{- end }}
  {{- end }}
  {{- with $s.networkPolicy.egress }}
  egress: {{- toYaml . | nindent 2 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
