{{- if .Values.enabled }}
{{- range $name, $entry := .Values.servers }}
{{- $s := include "rta.server.values" (dict "root" $ "server" $entry) | fromYaml }}
{{- if and $s.enabled $s.serviceAccount.create }}
---
{{- /* One ServiceAccount per instance, never one shared by the release.

In the "share the image" recipe a profile reads its credentials as `kube:postgres-creds/password`,
resolved with the caller's own kubeconfig and their own RBAC. In a pod there is no caller's
kubeconfig, so whatever identity the pod carries is the one those reads happen under. An instance
whose identity can read every Secret in the namespace has quietly rebuilt the single shared server
the design rejects, wearing per-person clothes - so the Role beside this names exactly the secrets
that person's profiles reference, and nothing else. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $s.serviceAccount.name | default (include "rta.serverFullname" (dict "root" $ "name" $name)) }}
  labels: {{- include "rta.labels" (dict "root" $ "name" $name) | nindent 4 }}
  {{- with $s.serviceAccount.annotations }}
  annotations: {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $s.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- end }}
{{- end }}
