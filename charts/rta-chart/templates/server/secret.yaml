{{- if .Values.enabled }}
{{- range $name, $entry := .Values.servers }}
{{- $s := include "rta.server.values" (dict "root" $ "server" $entry) | fromYaml }}
{{- if $s.enabled }}
{{- $fullname := include "rta.serverFullname" (dict "root" $ "name" $name) }}
{{- if and $s.auth.tokens.enabled (not $s.auth.tokens.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-tokens" $fullname }}
  labels: {{- include "rta.labels" (dict "root" $ "name" $name) | nindent 4 }}
type: Opaque
stringData:
  {{- /* The file `--token-file` reads, plus each token again under its own key.

  The per-label keys exist for one caller: a Prometheus ServiceMonitor's `bearerTokenSecret`, which
  reads a key and sends its whole content as the credential, so it cannot be pointed at the
  multi-line file. It is the same secret material either way - the label keys expose nothing the
  file does not already hold in the same object. */}}
  {{ $s.auth.tokens.key }}: |
    {{- include "rta.server.tokenFile" (dict "server" $s) | nindent 4 }}
  {{- range $label, $token := $s.auth.tokens.entries }}
  {{ printf "token-%s" $label }}: {{ $token | quote }}
  {{- end }}
{{- end }}
{{- if and $s.operators.enabled (not $s.operators.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-roster" $fullname }}
  labels: {{- include "rta.labels" (dict "root" $ "name" $name) | nindent 4 }}
type: Opaque
stringData:
  {{ $s.operators.key }}: |
    {{- include "rta.server.roster" (dict "server" $s) | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
