{{- if .Values.enabled }}
{{- range $name, $entry := .Values.servers }}
{{- $s := include "rta.server.values" (dict "root" $ "server" $entry) | fromYaml }}
{{- if and $s.enabled (or $s.secretRefs $s.extraRules) }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "rta.serverFullname" (dict "root" $ "name" $name) }}
  labels: {{- include "rta.labels" (dict "root" $ "name" $name) | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "rta.serverFullname" (dict "root" $ "name" $name) }}
subjects:
- kind: ServiceAccount
  name: {{ $s.serviceAccount.name | default (include "rta.serverFullname" (dict "root" $ "name" $name)) }}
  namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
