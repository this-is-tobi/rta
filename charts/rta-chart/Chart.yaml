apiVersion: v2
name: rta-chart
type: application
version: 0.1.0
appVersion: "0.16.0"
description: Deploy rta MCP servers into Kubernetes, one instance per person.
# Floor set by the core APIs the chart renders. The Gateway API resources
# additionally need the gateway.networking.k8s.io CRDs installed in the cluster,
# and the ServiceMonitor needs the Prometheus Operator's.
kubeVersion: ">=1.25.0-0"
home: https://this-is-tobi.github.io/rta
deprecated: false
annotations:
  artifacthub.io/category: security
  artifacthub.io/license: Apache-2.0
keywords:
- rta
- mcp
- security
- ai-agents
# No `dependencies:` key, not even an empty one. Helm treats its mere presence as something to
# resolve: `helm dependency update` then writes a Chart.lock holding `dependencies: []` and a
# timestamp, and both chart-testing and release-helm-local.yml (which greps Chart.yaml for the key
# before deciding whether to resolve) would do that work on every lint and every publish, for zero
# dependencies. This chart renders only its own templates; when it gains a real dependency, the key
# comes back with that dependency in it.
sources:
- https://github.com/this-is-tobi/rta
maintainers:
- name: this-is-tobi
  email: this-is-tobi@proton.me
  url: https://this-is-tobi.com
