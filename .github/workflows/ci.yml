# What a laptop cannot check for you.
#
# The suite reads the machine it runs on — data directories, config
# directories, $PATH, /etc — and a bug in that isolation looks exactly like a
# passing test until somebody else's machine is different. That has already
# happened once here: tests picked up a developer's own age key and only went
# red on the day that key existed. CI is the second machine.
#
# Everything below is a call into the shared workflow catalogue rather than a
# script kept here. The gates are the same ones `make ci` runs, expressed as
# that catalogue's inputs: -count=1, -race and -shuffle=on are `make hard`.
# One thing stays local: the cross build, which nothing general covers.
name: CI

on:
  pull_request:
    types:
    - opened
    - reopened
    - synchronize
    - ready_for_review
    branches:
    - "**"

# A superseded run is not worth finishing: a follow-up push to the same
# branch cancels the run for the commit it replaced, instead of letting
# dozens of stale jobs keep their runner slots while the new run queues
# behind them. head_ref is always set here — this workflow only runs on
# pull_request events.
concurrency:
  group: ci-${{ github.head_ref }}
  cancel-in-progress: true

# Every job below narrows this further; nothing here writes.
permissions:
  contents: read

jobs:
  lint-commits:
    name: Lint commits
    # Only on a pull request: on a push the range this walks is whatever was
    # pushed, which on a branch's first push is its entire history.
    if: ${{ github.event_name == 'pull_request' }}
    uses: this-is-tobi/github-workflows/.github/workflows/lint-commits.yml@v0
    permissions:
      contents: read
      pull-requests: read

  # A pull request that only touches prose has nothing for the build, test,
  # cross-compile or image gates to check, so those jobs skip when every
  # changed file is documentation. This job is the one place "documentation"
  # is defined; everything unmatched — code, workflows, build files, anything
  # new — counts as code, so an unanticipated path fails toward running the
  # suite rather than skipping it.
  #
  # Most jobs read this output directly; the test-docker jobs skip
  # transitively through `needs` on their build, and `all-jobs-passed`
  # already counts a skipped job as a pass — it was built for exactly this. The file list comes from the API rather than a
  # checkout: it is the pull request's own answer to "what does this change",
  # needs no third-party filter action, and costs seconds.
  #
  # lint-commits and scan-secrets stay unconditional on purpose: a docs PR
  # still needs conventional commits, and a credential pasted into a docs
  # page is exactly as leaked as one in code.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Classify changed files
      id: diff
      run: |-
        files=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
        code=false
        while IFS= read -r f; do
          [ -z "$f" ] && continue
          case "$f" in
            docs/*|*.md|LICENSE|NOTICE) ;;
            *) code=true ;;
          esac
        done <<< "$files"
        echo "changed files are docs-only: $([ "$code" = false ] && echo yes || echo no)"
        echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    name: Lint
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: this-is-tobi/github-workflows/.github/workflows/lint-go.yml@v0
    permissions:
      contents: read
    with:
      # The trees that are this module. `examples/` has no go.mod, so it
      # compiles as part of this module, and leaving it out here made it the
      # single directory nothing formatted. It is also the first Go a plugin
      # author reads.
      FORMAT_PATHS: ./builtin ./cmd ./examples ./internal ./pkg

  # proto/v1 is frozen: a plugin compiled against it must keep working. Nothing
  # enforced that for a while — `proto-check` existed, `make ci` did not call
  # it, and the pipeline called neither — so renumbering a field passed gofmt,
  # vet, build and the whole race suite, and was caught by no gate anywhere.
  lint-proto:
    name: Lint proto
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: this-is-tobi/github-workflows/.github/workflows/lint-proto.yml@v0
    permissions:
      contents: read
    with:
      WORKING_DIRECTORY: proto
      # BREAKING defaults to true and derives its baseline from the pull
      # request's base branch, which main now carries. What counts as breaking
      # is proto/buf.yaml's `breaking.use`, deliberately set to WIRE rather
      # than the stricter FILE — see that file for why, and for what to do on
      # the day a wire break is the right call.

  test:
    name: Test
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: this-is-tobi/github-workflows/.github/workflows/test-go.yml@v0
    permissions:
      contents: read
    with:
      # `make hard` in the catalogue's own words: no cached results, no
      # ordering luck, no data races. All three have caught something real.
      RACE: true
      SHUFFLE: true
      COUNT: "1"
      # The second machine — and the third. A suite that reads the host it
      # runs on passes on the host it was written on, and the first two
      # runners share a blind spot: ubuntu is amd64 and macOS reads sysctl
      # rather than procfs, so nothing here ever read arm64 Linux — the
      # platform the docker image and half the release binaries target. That
      # gap hid a real bug (sys.cpu rendered a blank model on every Pi and
      # Graviton) until the suite was run in an arm64 container by hand; the
      # arm runner makes that reading automatic.
      RUNNERS: '[["ubuntu-latest"], ["macos-latest"], ["ubuntu-24.04-arm"]]'
      COVERAGE: true
      # Most of this module is exercised from other packages' tests, which
      # reads as untested without this.
      COVERAGE_PACKAGES: ./...

  # The fourth runner the job above argues for, at a tenth of its scope.
  #
  # Two packages, not `./...`, and that is a statement about the suite rather
  # than about Windows: much of it assumes Unix paths, modes and sandboxing,
  # and making all of it Windows-clean is its own piece of work. These two are
  # where the platform is actually load-bearing, so these two run.
  #
  # It exists because `cross` proving the code compiles for windows/amd64 hid
  # three separate bugs that made a plugin unloadable there, none of which a
  # compiler can see: discovery tested files for the execute bit, which
  # Windows reports on none of them, so nothing was ever discovered; the
  # namespace was the filename minus the prefix, which on Windows is "pg.exe";
  # and the store pointed bin/ at a symlink, which an unprivileged Windows
  # refuses outright, ending every install at its last step. rta ships for
  # Windows, so it has to be able to say those stay fixed — and whoever
  # publishes the plugin archives, only a Windows machine can say it.
  #
  # No race detector: it needs a C toolchain on Windows, and this leg is about
  # filenames, modes and links. Concurrency is covered by the three runners
  # above, which do run under -race.
  test-windows:
    name: Test the plugin store on Windows
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: this-is-tobi/github-workflows/.github/workflows/test-go.yml@v0
    permissions:
      contents: read
    with:
      PACKAGES: ./internal/plugindist/... ./internal/pluginhost/...
      RUNNERS: '[["windows-latest"]]'
      SHUFFLE: true
      COUNT: "1"

  # Every target a release ships, built the way a release builds it. This runs
  # GoReleaser's own configuration, so it fails on a change that breaks
  # packaging and not only on one that breaks compiling — which the plain cross
  # build below cannot see.
  build:
    name: Build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: this-is-tobi/github-workflows/.github/workflows/build-go.yml@v0
    permissions:
      contents: read

  # Builds the same Dockerfile the release pipeline publishes from, so a
  # change that breaks the image is caught here rather than on a release.
  # PUSH: false exports it as a tarball instead — nothing is published from a
  # pull request.
  #
  # Both architectures the release ships, each on its own native runner
  # (build-docker.yml's matrix — no QEMU). The release pipeline's arm64 leg
  # would otherwise run for the first time on release day, which is the one
  # day nobody wants a first time; a pure-Go build on a native arm runner
  # costs about what the amd64 leg costs.
  build-docker:
    name: Build Docker image
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: this-is-tobi/github-workflows/.github/workflows/build-docker.yml@v0
    permissions:
      packages: write
      contents: read
    with:
      IMAGE_NAME: ghcr.io/this-is-tobi/rta
      IMAGE_TAG: pr-${{ github.event.pull_request.number }}
      IMAGE_CONTEXT: ./
      IMAGE_DOCKERFILE: ./Dockerfile
      PUSH: false
      BUILD_AMD64: true
      BUILD_ARM64: true
      BUILD_ARGS: |
        VERSION=pr-${{ github.event.pull_request.number }}
        COMMIT=${{ github.sha }}

  # Catches what a successful build cannot: a binary that built but does not
  # actually start in the image it was built into — the same class of gap
  # `cross` exists for below, one layer further out.
  test-docker:
    name: Test Docker image (amd64)
    needs: [build-docker]
    uses: this-is-tobi/github-workflows/.github/workflows/test-docker.yml@v0
    permissions:
      contents: read
      packages: read
    with:
      IMAGE_ARTIFACT: ${{ needs.build-docker.outputs.artifact-prefix }}-amd64
      COMMAND: --version

  # The arm64 image, actually executed — on the arm runner, so this runs the
  # real binary rather than an emulation of it. This is the only place the
  # suite runs anything on arm64 Linux at all: the test matrix is
  # ubuntu-amd64 + macos-arm64, a gap that has already hidden one real bug
  # (sys.cpu's blank model, invisible to both runners).
  test-docker-arm64:
    name: Test Docker image (arm64)
    needs: [build-docker]
    uses: this-is-tobi/github-workflows/.github/workflows/test-docker.yml@v0
    permissions:
      contents: read
      packages: read
    with:
      IMAGE_ARTIFACT: ${{ needs.build-docker.outputs.artifact-prefix }}-arm64
      COMMAND: --version
      RUNS_ON: '["ubuntu-24.04-arm"]'

  # The full image is a different build of a different thing: eleven plugin
  # releases installed from rta-plugins by pinned tag, an Alpine base with
  # real packages on it, and a `plugin trust` per plugin at build time.
  # build-docker above exercises none of that, so without this a break in it
  # — a pin that no longer resolves, above all — would be found by the release
  # that publishes it rather than by the pull request that caused it.
  #
  # It does cost more than the primary image — eleven extra module builds per
  # architecture — and the two legs run on their own native runners in
  # parallel, so the wall-clock is one leg rather than both. If that ever
  # stops being worth it, this is the job to drop: CD would still build the
  # image, just later than here.
  build-docker-full:
    name: Build full Docker image
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: this-is-tobi/github-workflows/.github/workflows/build-docker.yml@v0
    permissions:
      packages: write
      contents: read
    with:
      IMAGE_NAME: ghcr.io/this-is-tobi/rta-full
      IMAGE_TAG: pr-${{ github.event.pull_request.number }}
      IMAGE_CONTEXT: ./
      IMAGE_DOCKERFILE: ./Dockerfile.full
      PUSH: false
      BUILD_AMD64: true
      BUILD_ARM64: true
      BUILD_ARGS: |
        VERSION=pr-${{ github.event.pull_request.number }}
        COMMIT=${{ github.sha }}

  # Worth its own run rather than trusting the primary image's: this one has a
  # shell script between docker and rta, and an entrypoint that fails to exec
  # is precisely the "built fine, does not start" gap test-docker exists for.
  test-docker-full:
    name: Test full Docker image (arm64)
    needs: [build-docker-full]
    uses: this-is-tobi/github-workflows/.github/workflows/test-docker.yml@v0
    permissions:
      contents: read
      packages: read
    with:
      IMAGE_ARTIFACT: ${{ needs.build-docker-full.outputs.artifact-prefix }}-arm64
      COMMAND: --version
      RUNS_ON: '["ubuntu-24.04-arm"]'

  # **A laptop can check this and nobody did.** `builtin/fs/platform.go`
  # asserted on `syscall.Stat_t` behind a comma-ok and documented the Windows
  # case as degrading to "always the same device" — but that type does not
  # exist on Windows, so the package did not compile there at all and the
  # degradation it promised could never happen. Nothing noticed, because
  # nothing ever built for a platform other than the one it was sitting on.
  #
  # Kept local rather than folded into `build` above: GoReleaser builds what a
  # release ships, and this proves every target compiles at all — a narrower
  # question with a much faster answer. Cross compilation is host-independent,
  # so once is enough.
  cross:
    name: Cross-compile every target
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true

    - name: Cross-compile
      run: make cross

  # rta is a security tool. A credential in its own history would be the kind
  # of thing it exists to find in yours.
  scan-secrets:
    name: Scan secrets
    uses: this-is-tobi/github-workflows/.github/workflows/scan-gitleaks.yml@v0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      PR_NUMBER: ${{ github.event.pull_request.number }}

  # A known vulnerability in a dependency is not a hypothetical for a tool
  # whose whole job is deciding what an agent may touch. govulncheck only
  # reports one reachable from this module's own code, not merely present in
  # go.sum, which is what keeps this worth failing the build on rather than
  # only reporting.
  scan-deps:
    name: Scan dependencies
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    uses: this-is-tobi/github-workflows/.github/workflows/scan-govulncheck.yml@v0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      PR_NUMBER: ${{ github.event.pull_request.number }}

  # One required check to protect the branch with, rather than a list that has
  # to be edited every time a job is added. A skipped job is a pass; anything
  # else is not.
  all-jobs-passed:
    name: Check jobs status
    runs-on: ubuntu-latest
    if: ${{ always() }}
    permissions: {}
    needs:
    - lint-commits
    - changes
    - lint
    - lint-proto
    - test
    - test-windows
    - build
    - build-docker
    - test-docker
    - test-docker-arm64
    - build-docker-full
    - test-docker-full
    - cross
    - scan-secrets
    - scan-deps
    steps:
    - name: Check status of all required jobs
      run: |-
        NEEDS_CONTEXT='${{ toJson(needs) }}'
        JOB_IDS=$(echo "$NEEDS_CONTEXT" | jq -r 'keys[]')
        for JOB_ID in $JOB_IDS; do
          RESULT=$(echo "$NEEDS_CONTEXT" | jq -r ".[\"$JOB_ID\"].result")
          echo "$JOB_ID job result: $RESULT"
          if [[ $RESULT != "success" && $RESULT != "skipped" ]]; then
            echo "***"
            echo "Error: The $JOB_ID job did not pass."
            exit 1
          fi
        done
        echo "All jobs passed or were skipped."
