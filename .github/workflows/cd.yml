# Two things create a release, in order, and neither is allowed to own both
# halves. release-please computes the version from conventional commits,
# writes the changelog, and publishes the release — publishing is what makes
# the tag exist, which is what release-go.yml needs to have anything to
# build. force-tag-creation stays set as belt and braces: it is what would
# keep the tag appearing if `draft` ever went back to true, where only
# publishing creates one. GoReleaser then builds every target this
# repository ships and attaches them to that same release: release.mode in
# .goreleaser.yaml is keep-existing, so it never touches the notes
# release-please already wrote, only the assets.
#
# Published immediately, not draft: merging a PR into main is the review gate
# — a release-please "chore(main): release" PR included — so a second manual
# "click publish" step afterward is ceremony the merge already did. See
# .goreleaser.yaml for why its own `draft: true` doesn't contradict this: it
# is a backstop for a release built outside this pipeline, not what governs
# here.
#
# main only, on purpose: no develop branch, no prerelease channel. Revisit if
# that stops being enough.
name: CD

on:
  push:
    branches: [main]

jobs:
  release:
    name: Release please
    uses: this-is-tobi/github-workflows/.github/workflows/release-app.yml@v0
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Neither secret needs to exist yet: unset, this falls through to the
    # job's own GITHUB_TOKEN, which is enough to open and update the release
    # pull request. What it buys once a GitHub App is set up (see
    # github-workflows/docs/05-authentication.md) is that pull request
    # actually running this repository's own CI, which GITHUB_TOKEN-opened
    # pull requests cannot trigger.
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  binaries:
    name: Release binaries
    needs: [release]
    if: ${{ needs.release.outputs.release-created == 'true' }}
    uses: this-is-tobi/github-workflows/.github/workflows/release-go.yml@v0
    permissions:
      contents: write
      # Granted and unused, because there is no narrower option: release-go's
      # job declares `packages: write` for the configurations whose GoReleaser
      # pushes images, a permissions block cannot be conditional, and GitHub
      # refuses to *start* a workflow whose nested job explicitly requests
      # more than its caller grants. An earlier revision left this at its
      # implicit `none` on the theory that the grant would intersect away —
      # it does not: the first CD run ever failed at validation, before a
      # single job ran, over exactly this line. .goreleaser.yaml still has no
      # `dockers:` block, so nothing in the job ever exercises the scope.
      packages: write
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # Attests the exact assets binaries just published — checksums.txt names
  # every archive and package GoReleaser attached to the release — rather
  # than a same-run copy of them. See attest-go.yml's own notes for why that
  # distinction is the point.
  attest-binaries:
    name: Attest binaries
    needs: [release, binaries]
    uses: this-is-tobi/github-workflows/.github/workflows/attest-go.yml@v0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      TAG: ${{ needs.release.outputs.tag-name }}
      PROVENANCE: true
      SBOM: true
      SIGN: true

  docker:
    name: Release Docker image
    needs: [release]
    if: ${{ needs.release.outputs.release-created == 'true' }}
    uses: this-is-tobi/github-workflows/.github/workflows/build-docker.yml@v0
    permissions:
      packages: write
      contents: read
    with:
      IMAGE_NAME: ghcr.io/this-is-tobi/rta
      IMAGE_TAG: ${{ needs.release.outputs.version }}
      IMAGE_CONTEXT: ./
      IMAGE_DOCKERFILE: ./Dockerfile
      LATEST_TAG: true
      TAG_MAJOR_AND_MINOR: true
      BUILD_ARGS: |
        VERSION=${{ needs.release.outputs.version }}
        COMMIT=${{ github.sha }}

  # **The full image does not ship from here.** It is the batteries-included
  # image, published beside the narrow one rather than instead of it — two
  # images because the narrowness is a security property (docs/30-boundary/20-mcp.md's
  # "the image is the plugin allowlist"), so the one carrying every plugin and
  # every tool is a deliberate second choice, not an upgrade of the first. See
  # Dockerfile.full for the whole argument.
  #
  # Publishing it is deliberate too, now: docker-full.yml builds and pushes it
  # on demand, with the version to tag stated by whoever runs it. Its pins move
  # only by hand, on nobody's schedule but the operator's, so a release that
  # republished it unchanged was mostly re-tagging the same eleven plugins. The
  # cost of the split is that `rta-full:latest` no longer follows `rta:latest`
  # on its own — after a release that matters to the full image, that run is
  # the step that makes it true.

  # Same reasoning as attest-binaries, against the pushed image digest
  # instead of a release asset — see attest-docker.yml's own notes for why
  # the SBOM verifies differently (cosign) than the provenance (gh
  # attestation).
  attest-docker:
    name: Attest Docker image
    needs: [docker]
    uses: this-is-tobi/github-workflows/.github/workflows/attest-docker.yml@v0
    permissions:
      packages: write
      id-token: write
      attestations: write
    with:
      IMAGE_NAME: ${{ needs.docker.outputs.image }}
      DIGEST: ${{ needs.docker.outputs.digest }}
      PROVENANCE: true
      SBOM: true
      SIGN: true

  # The full image's attestations moved with it, into docker-full.yml — it
  # needs them if anything more than the narrow one does, carrying eleven
  # plugin binaries and a package manager's worth of tools, so "which build
  # produced this, and what is in it" is a longer answer somebody is more
  # likely to want. A push from there is attested exactly as a push from here
  # was; what changed is who decides when it happens.

  # The chart ships on its own version stream, not the app's. Its unit of
  # change is a different thing: a values default, a template fix or a new
  # option is a chart release with no new rta in it, and pinning the two
  # together would mean either inventing app releases for chart fixes or
  # stranding chart fixes until the next one. update-helm-chart is the version
  # brain — UPGRADE_TYPE defaults to 'auto', which mirrors the app's own level
  # off the appVersion delta, so an app minor moves the chart's minor — and it
  # commits the bump, which is what keeps Chart.yaml in git saying what was
  # actually published.
  #
  # RUN_MODE local commits straight onto main instead of opening a pull
  # request. Pushed with the App token, that commit re-triggers this workflow,
  # which is harmless: release-please sees a lone `chore` commit, reports
  # release-created false, and all three jobs here skip. The alternative — a
  # pull request nobody is waiting on, gating a release that already happened —
  # is the worse end of that trade.
  bump-chart:
    name: Bump chart version
    needs: [release]
    if: ${{ needs.release.outputs.release-created == 'true' }}
    uses: this-is-tobi/github-workflows/.github/workflows/update-helm-chart.yml@v0
    permissions:
      contents: write
      # Granted and unused, exactly as `packages: write` is on `binaries`
      # above: update-helm-chart's job declares it for the pull request
      # RUN_MODE 'called' opens, a permissions block cannot be conditional, and
      # GitHub refuses to start a workflow whose nested job requests more than
      # its caller grants. Local mode never opens one.
      pull-requests: write
    with:
      RUN_MODE: local
      CHART_DIR: charts
      CHART_NAME: rta-chart
      APP_VERSION: ${{ needs.release.outputs.version }}
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # REGISTRY and REPOSITORY are left at their defaults — ghcr.io and
  # github.repository — because those already resolve to
  # ghcr.io/this-is-tobi/rta/rta-chart, the address docs/30-boundary/80-kubernetes.md
  # and the chart's own README tell people to `helm install` from. Restating
  # them here would be a second place for that to drift.
  chart:
    name: Release Helm chart
    needs: [bump-chart]
    uses: this-is-tobi/github-workflows/.github/workflows/release-helm-local.yml@v0
    permissions:
      contents: read
      packages: write
    with:
      CHARTS_DIR: ./charts
      CHART_NAME: rta-chart
      # The bump commit, not the commit that triggered this run. Packaging the
      # latter would publish whatever version Chart.yaml held *before*
      # bump-chart wrote to it, leaving the registry and git disagreeing about
      # what a given rta-chart version contains.
      CHECKOUT_REF: ${{ needs.bump-chart.outputs.commit-sha }}

  # Same reasoning as attest-binaries and attest-docker, for the artifact that
  # decides what the other two become at runtime: a chart names the image, the
  # roots, the token and operator keys and the consent posture of every
  # instance it deploys, so "which pipeline built this, from which commit" is
  # at least as worth answering here as for a binary. Bound to the digest
  # release-helm-local read back out of `helm push`, never to the tag — see
  # attest-helm.yml's own notes for why a tag would defeat the point.
  attest-chart:
    name: Attest Helm chart
    needs: [chart]
    uses: this-is-tobi/github-workflows/.github/workflows/attest-helm.yml@v0
    permissions:
      packages: write
      id-token: write
      attestations: write
    with:
      CHARTS: ${{ needs.chart.outputs.published-charts }}
      PROVENANCE: true
      SIGN: true
