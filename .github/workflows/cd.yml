# Two things create a release, in order, and neither is allowed to own both
# halves. release-please computes the version from conventional commits,
# writes the changelog, and publishes the release — publishing is what makes
# the tag exist, which is what release-go.yml needs to have anything to
# build. force-tag-creation stays set as belt and braces: it is what would
# keep the tag appearing if `draft` ever went back to true, where only
# publishing creates one. GoReleaser then builds every target this
# repository ships and attaches them to that same release: release.mode in
# .goreleaser.yaml is keep-existing, so it never touches the notes
# release-please already wrote, only the assets.
#
# Published immediately, not draft: merging a PR into main is the review gate
# — a release-please "chore(main): release" PR included — so a second manual
# "click publish" step afterward is ceremony the merge already did. See
# .goreleaser.yaml for why its own `draft: true` doesn't contradict this: it
# is a backstop for a release built outside this pipeline, not what governs
# here.
#
# main only, on purpose: no develop branch, no prerelease channel. Revisit if
# that stops being enough.
name: CD

on:
  push:
    branches: [main]

jobs:
  release:
    name: Release please
    uses: this-is-tobi/github-workflows/.github/workflows/release-app.yml@v0
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Neither secret needs to exist yet: unset, this falls through to the
    # job's own GITHUB_TOKEN, which is enough to open and update the release
    # pull request. What it buys once a GitHub App is set up (see
    # github-workflows/docs/05-authentication.md) is that pull request
    # actually running this repository's own CI, which GITHUB_TOKEN-opened
    # pull requests cannot trigger.
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  binaries:
    name: Release binaries
    needs: [release]
    if: ${{ needs.release.outputs.release-created == 'true' }}
    uses: this-is-tobi/github-workflows/.github/workflows/release-go.yml@v0
    permissions:
      contents: write
      # Granted and unused, because there is no narrower option: release-go's
      # job declares `packages: write` for the configurations whose GoReleaser
      # pushes images, a permissions block cannot be conditional, and GitHub
      # refuses to *start* a workflow whose nested job explicitly requests
      # more than its caller grants. An earlier revision left this at its
      # implicit `none` on the theory that the grant would intersect away —
      # it does not: the first CD run ever failed at validation, before a
      # single job ran, over exactly this line. .goreleaser.yaml still has no
      # `dockers:` block, so nothing in the job ever exercises the scope.
      packages: write
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}

  # Attests the exact assets binaries just published — checksums.txt names
  # every archive and package GoReleaser attached to the release — rather
  # than a same-run copy of them. See attest-go.yml's own notes for why that
  # distinction is the point.
  attest-binaries:
    name: Attest binaries
    needs: [release, binaries]
    uses: this-is-tobi/github-workflows/.github/workflows/attest-go.yml@v0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      TAG: ${{ needs.release.outputs.tag-name }}
      PROVENANCE: true
      SBOM: true
      SIGN: true

  docker:
    name: Release Docker image
    needs: [release]
    if: ${{ needs.release.outputs.release-created == 'true' }}
    uses: this-is-tobi/github-workflows/.github/workflows/build-docker.yml@v0
    permissions:
      packages: write
      contents: read
    with:
      IMAGE_NAME: ghcr.io/this-is-tobi/rta
      IMAGE_TAG: ${{ needs.release.outputs.version }}
      IMAGE_CONTEXT: ./
      IMAGE_DOCKERFILE: ./Dockerfile
      LATEST_TAG: true
      TAG_MAJOR_AND_MINOR: true
      BUILD_ARGS: |
        VERSION=${{ needs.release.outputs.version }}
        COMMIT=${{ github.sha }}

  # Same reasoning as attest-binaries, against the pushed image digest
  # instead of a release asset — see attest-docker.yml's own notes for why
  # the SBOM verifies differently (cosign) than the provenance (gh
  # attestation).
  attest-docker:
    name: Attest Docker image
    needs: [docker]
    uses: this-is-tobi/github-workflows/.github/workflows/attest-docker.yml@v0
    permissions:
      packages: write
      id-token: write
      attestations: write
    with:
      IMAGE_NAME: ${{ needs.docker.outputs.image }}
      DIGEST: ${{ needs.docker.outputs.digest }}
      PROVENANCE: true
      SBOM: true
      SIGN: true
