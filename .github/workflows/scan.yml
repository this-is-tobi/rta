# What a pull request cannot see: a vulnerability published after the last
# merge. ci.yml runs govulncheck and gitleaks on every pull request and
# nothing ran between pull requests, so a CVE disclosed against a module
# already on main — or a credential that slipped into history — waited for
# the next code change to be noticed. This is the same three scans the
# catalogue already offers, on a clock, against main and the released
# image, reporting to the repository's security tab.
#
# Weekly rather than daily: govulncheck reports only what this module's own
# code reaches, so the signal is rare and worth a look when it fires; a
# daily run would be a daily green tick nobody reads.
name: Scan

on:
  schedule:
  - cron: "23 6 * * 1"
  workflow_dispatch:

# Every job below narrows this further; nothing here writes to the tree.
permissions:
  contents: read

jobs:
  # Each `uses:` below has to grant `pull-requests: write`, and none of them
  # spends it. GitHub validates a called workflow's jobs against the calling
  # job's grant when it sets the run up — before any `if:` is evaluated —
  # and all three of these catalogue workflows end in a `scan-notif` job
  # that declares `pull-requests: write` at the job level unconditionally.
  # Without the grant the whole run ends in startup_failure: no jobs, no
  # log, no annotation anybody reads, silently, every Monday. actionlint
  # cannot see this — it does not resolve a remote reusable workflow's
  # permission requests — and ci.yml carries the same grant for the same
  # reason — cc2431e fixed the identical regression there.
  # scan-notif is skipped outright for the two Go scans (their `if:` tests
  # PR_NUMBER, which a scheduled run never has) and runs with every step
  # skipped for the image scan, so the scope is granted and never spent.
  #
  # scan-deps carries no GITHUB_SECURITY_TAB: the callee only uploads a
  # SARIF file when FORMAT == 'sarif', govulncheck's default FORMAT here is
  # 'text', and govulncheck exits 0 in sarif/json mode even against a
  # reachable vulnerability — verified directly against golang.org/x/text
  # v0.3.0's CVE-2020-14040. Setting FORMAT: sarif to reach the Security tab
  # would trade the weekly job's pass/fail gate for a summary that always
  # says clean. A red weekly job is the honest signal until the catalogue
  # runs govulncheck twice, the way rta-plugins' inline scan-deps job does.
  scan-deps:
    name: Scan dependencies
    uses: this-is-tobi/github-workflows/.github/workflows/scan-govulncheck.yml@v0
    permissions:
      contents: read
      security-events: write
      pull-requests: write

  scan-secrets:
    name: Scan secrets
    uses: this-is-tobi/github-workflows/.github/workflows/scan-gitleaks.yml@v0
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    with:
      GITHUB_SECURITY_TAB: true

  # The parsers that read hostile bytes, fuzzed for real. A pull request runs
  # only each target's seed corpus; the mutating run costs minutes and finds
  # what a seed cannot, so it lives on the schedule. `make fuzz` is the list
  # of targets, so a parser gaining one joins this without a change here.
  fuzz:
    name: Fuzz the hostile-input parsers
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true

    - name: Fuzz
      run: make fuzz FUZZTIME=90s

  # The image people actually pull, as it is on the registry: base-image
  # advisories land here, and they land on a schedule of their own that no
  # pull request in this repository follows.
  #
  # CATEGORY on both image legs, because it is what keeps them from erasing
  # each other: scan-trivy.yml uploads SARIF under it, and uploads sharing a
  # category replace one another, leaving only whichever finished last. This
  # leg's earlier uploads went up with none, so the uncategorised analysis
  # they left in the Security tab has to be deleted by hand once the
  # categorised ones land.
  scan-image:
    name: Scan the released image
    uses: this-is-tobi/github-workflows/.github/workflows/scan-trivy.yml@v0
    permissions:
      contents: read
      packages: read
      security-events: write
      pull-requests: write
    with:
      IMAGE: ghcr.io/this-is-tobi/rta:latest
      GITHUB_SECURITY_TAB: true
      FAIL_ON_ERROR: true
      CATEGORY: trivy-rta

  # The batteries-included image, which is where the advisory surface is: an
  # Alpine base with docker-cli, kubectl, git, openssh-client and three
  # database clients, plus eleven plugin binaries, where the narrow image is
  # distroless with one binary in it. It was never scanned, at release time
  # or on a clock. TIMEOUT above Trivy's five-minute default, because that
  # default's failure is total — the scan aborts and writes no report at all
  # — and eleven statically linked Go binaries on one image is the case
  # scan-trivy.yml's own input describes. The callee ignores advisories with
  # no fix, so a red run here is one somebody can act on.
  scan-image-full:
    name: Scan the released full image
    uses: this-is-tobi/github-workflows/.github/workflows/scan-trivy.yml@v0
    permissions:
      contents: read
      packages: read
      security-events: write
      pull-requests: write
    with:
      IMAGE: ghcr.io/this-is-tobi/rta-full:latest
      GITHUB_SECURITY_TAB: true
      FAIL_ON_ERROR: true
      CATEGORY: trivy-rta-full
      TIMEOUT: 20m
