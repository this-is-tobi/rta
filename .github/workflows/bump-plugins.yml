# Dockerfile.full installs its plugins from the official index at one stated
# commit — the `official@<commit>` entry on its RTA_INDEXES line — so what
# the image ships is always a named state of the index, never "whatever main
# was". Nothing else moved that commit: rta-plugins releases a plugin, its
# manifest changes, and the image kept building from the older claims until
# somebody noticed.
#
# This closes that the same direction rta-plugins' own bump-rta.yml closes
# the opposite one: poll, diff, open a pull request, let CI be the review.
# When the index's newest commit is not the one pinned, the pin moves to it
# and the pull request says what changed between the two: which plugins
# joined, which versions moved, which left. A plugin that left the index
# leaves the image at that build, and the body says so first — that is a
# decision the index made and the reviewer confirms, not one this workflow
# takes quietly. Other entries on the line are somebody's own indexes and
# are never touched.
#
# Polling, on purpose, and the same reasoning as bump-rta.yml: reading
# rta-plugins' public commits needs no credential at all, and a push from
# rta-plugins' own release workflow would need a token here that could act on
# this repository — which is a credential this repository otherwise has no
# reason to hand out. workflow_dispatch is the zero-delay path when somebody
# is watching.
#
# The pull request is opened as the App rather than with GITHUB_TOKEN: a pull
# request GITHUB_TOKEN opens gets no CI run on it, and an image built from a
# pin nobody has actually built is exactly the change that must not merge on
# trust. ci.yml builds the full image for a pull request that touches
# Dockerfile.full — this one, and hardly any other — so the check is the
# build itself, not a proxy for it.
#
# A merged bump is not an rta release, and the commit type below is what
# makes that true: `chore` is a hidden type in release-please-config.json,
# and release-please opens a release pull request only for commits whose
# type is visible there — its log says "No user facing commits found" and
# stops for a push of hidden types alone. It has to be this way. An rta
# release makes rta-plugins' bump-rta.yml release every plugin against it, a
# plugin release changes the index, and this workflow then moves the pin; if
# that bump cut a release, the two repositories would release each other
# forever — which they did once, for one turn, while the bump was typed
# `build`. Excluding Dockerfile.full through release-please's exclude-paths
# was tried first and did not exclude it. The full image is published from
# docker-full.yml at the version somebody states, and a bump merged between
# releases is picked up by the next run of it.
name: Bump plugins

on:
  schedule:
  # Every two hours, off the hour. It ran every thirty minutes — forty-eight
  # times a day, each a checkout and an index read — for a pin that moves a
  # few times a week; a plugin release still reaches the full image within
  # the hour its own bump-rta.yml takes, and a dispatch is there for the rest.
  - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: the scheduled run and a dispatched one landing together
# would each read the open pull request, each decide it is behind, and race
# to push the same branch. The later one waits instead.
concurrency:
  group: bump-plugins
  cancel-in-progress: false

jobs:
  bump:
    name: Open a pull request when the official index moved
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checks-out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Find the index commit the image should build from
      id: target
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        line=$(awk -F'"' '/^ARG RTA_INDEXES="/ { print $2; exit }' Dockerfile.full)
        pinned=""
        for entry in $line; do
          case "$entry" in
            official@*) pinned="${entry#official@}" ;;
            official)   pinned="" ;;
          esac
        done
        echo "pinned: ${pinned:-none}"

        # The newest commit that touched index/, not the tip of main: a
        # commit that changed nothing under index/ changes nothing the image
        # installs, and a pull request for it would build the same image
        # twice.
        newest=$(gh api "repos/this-is-tobi/rta-plugins/commits?path=index&per_page=1" --jq '.[0].sha')
        if [ -z "$newest" ]; then
          echo "could not read the index's newest commit; nothing moved" >&2; exit 1
        fi
        echo "newest: $newest"
        if [ "$newest" = "$pinned" ]; then
          echo "the image already builds from the index's newest commit"; exit 0
        fi

        # What changed between the two, from the manifests themselves. Each
        # manifest names its plugin's version; a file added is a plugin that
        # joined, a file gone is one that left, a version that differs is a
        # bump. With no previous pin every plugin reads as joined, which is
        # also true.
        versions() {
          gh api "repos/this-is-tobi/rta-plugins/contents/index?ref=$1" --jq '.[].name' \
            | sed -n 's/\.yaml$//p' | while read -r name; do
              v=$(gh api "repos/this-is-tobi/rta-plugins/contents/index/${name}.yaml?ref=$1" --jq .content \
                | base64 -d | awk '$1 == "version:" && !seen { gsub(/"/, "", $2); print $2; seen = 1 }')
              echo "$name $v"
            done
        }
        after=$(versions "$newest")
        before=""
        if [ -n "$pinned" ]; then before=$(versions "$pinned"); fi
        nl=$'\n'
        joined=""; bumped=""; left=""
        while read -r name v; do
          [ -z "$name" ] && continue
          old=$(printf '%s\n' "$before" | awk -v n="$name" '$1 == n { print $2 }')
          if [ -z "$old" ]; then
            joined="${joined}- ${name}: joins at \`v${v}\`${nl}"
          elif [ "$old" != "$v" ]; then
            bumped="${bumped}- ${name}: \`v${old}\` → \`v${v}\`${nl}"
          fi
        done <<< "$after"
        while read -r name v; do
          [ -z "$name" ] && continue
          if ! printf '%s\n' "$after" | awk -v n="$name" '$1 == n { found = 1 } END { exit !found }'; then
            left="${left}- ${name}: \`v${v}\` is no longer in the index and leaves the image${nl}"
          fi
        done <<< "$before"

        report="Pins the official index at [\`${newest:0:12}\`](https://github.com/this-is-tobi/rta-plugins/commit/${newest})"
        if [ -n "$pinned" ]; then
          report="${report}, from [\`${pinned:0:12}\`](https://github.com/this-is-tobi/rta-plugins/compare/${pinned}...${newest})"
        fi
        report="${report}.${nl}${nl}"
        if [ -n "$left" ]; then
          report="${report}**Leaves the image** — the index dropped these; merging confirms it:${nl}${left}${nl}"
        fi
        if [ -n "$joined" ]; then
          report="${report}**Joins the image** — a plugin may shell out to a tool; check the package list in Dockerfile.full before merging:${nl}${joined}${nl}"
        fi
        if [ -n "$bumped" ]; then
          report="${report}**Bumped:**${nl}${bumped}${nl}"
        fi
        if [ -z "$left$joined$bumped" ]; then
          report="${report}No manifest changed its version between the two commits; the index's other files did.${nl}"
        fi
        printf '%s' "$report"

        # One branch and one pull request, rewritten in place, the way
        # release-please keeps a single release pull request current: a
        # later commit replaces the earlier one on the same branch, and the
        # pull request's body says what it holds today. A run that finds the
        # commit the open pull request already pins does nothing.
        branch="bump-plugins"
        open_pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
        if [ -n "$open_pr" ]; then
          # awk reads to the end rather than exiting on the match: an early
          # exit closes the pipe under base64, and under pipefail its write
          # error fails the step.
          on_pr=$(gh api "repos/${GITHUB_REPOSITORY}/contents/Dockerfile.full?ref=${branch}" --jq .content \
            | base64 -d | awk -F'"' '/^ARG RTA_INDEXES="/ && !seen { print $2; seen = 1 }')
          case " $on_pr " in
            *" official@${newest} "*) echo "pull request #$open_pr already pins $newest"; exit 0 ;;
          esac
          echo "pull request #$open_pr is behind; it will be rewritten"
        fi

        {
          echo "ref=$newest"
          echo "branch=$branch"
          echo "pr=$open_pr"
          echo "report<<BUMP_PLUGINS_REPORT_EOF"
          printf '%s' "$report"
          echo "BUMP_PLUGINS_REPORT_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Move the pin
      if: steps.target.outputs.ref != ''
      env:
        REF: ${{ steps.target.outputs.ref }}
      run: make bump-index REF="$REF"

    - name: Mint the App token
      if: steps.target.outputs.ref != ''
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ secrets.APP_CLIENT_ID }}
        private-key: ${{ secrets.APP_PRIVATE_KEY }}
        # Contents and pull requests, and nothing about workflows: this
        # workflow never touches a file under .github/workflows/, and an App
        # token cannot without a permission that would apply to every
        # repository the App is installed on.
        permission-contents: write
        permission-pull-requests: write

    - name: Commit, push and open or rewrite the pull request
      if: steps.target.outputs.ref != ''
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        BRANCH: ${{ steps.target.outputs.branch }}
        PR: ${{ steps.target.outputs.pr }}
        REPORT: ${{ steps.target.outputs.report }}
      run: |
        set -euo pipefail
        git config user.name github-actions[bot]
        git config user.email github-actions[bot]@users.noreply.github.com
        git checkout -b "$BRANCH"
        git add Dockerfile.full
        git commit -m "chore(docker): the full image builds from the index's newest commit" \
          -m "$REPORT"
        # Forced, because the branch is the workflow's own and its previous
        # tip was superseded, never reviewed and kept: the pull request has
        # exactly one commit, from main, every time. Forced with a lease on
        # the tip read just now — an empty tip meaning the branch must not
        # exist yet — so a push nobody here has seen is refused rather than
        # overwritten, and the run fails loudly instead of rewriting it.
        remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        expected=$(git ls-remote "$remote" "refs/heads/$BRANCH" | cut -f1)
        git push --force-with-lease="refs/heads/$BRANCH:$expected" "$remote" "$BRANCH"
        body="$(printf '%s\n\n%s' \
          "$REPORT" \
          "Opened by the bump workflow, and rewritten by it whenever the official index moves again before this merges. CI builds and starts the full image on this pull request: a red check means the image no longer builds from this state of the index.")"
        if [ -n "$PR" ]; then
          gh pr edit "$PR" --body "$body"
        else
          gh pr create --base main --head "$BRANCH" \
            --title "chore(docker): the full image builds from the index's newest commit" \
            --body "$body"
        fi
