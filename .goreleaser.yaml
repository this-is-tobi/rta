# What a release ships, and what it says about itself.
#
# rta is a security tool, so the interesting parts of this file are the ones
# about provenance rather than the ones about platforms: a checksum file, and
# a version and commit the binary can state back to you. `rta plugin trust`
# already binds an authorization to an artifact's digest rather than to its
# name; a release that could not be checked the same way would be
# holding its own users to a standard it does not meet.
#
# **No SBOM, and named rather than assumed.** This comment used to list one
# among the things a release ships, and no `sboms:` block has ever been here.
# GoReleaser generates them by shelling out to syft, an external binary the
# release machine has to have — which makes it a decision about the release
# environment rather than a line of configuration, and an unmade decision
# should not read as a shipped feature. Same failure as `-X main.date` below,
# in prose instead of a flag.
version: 2

project_name: rta

# Deliberately no `before: hooks: [go mod tidy]`, which is GoReleaser's own
# scaffolded default. A release must build what is committed rather than tidy
# it first: the hook rewrites go.mod and go.sum in the working tree, and
# `goreleaser release` requires a clean tree, so on a tree that is not already
# tidy the hook makes the release fail — and on one that is, it does nothing.
# Tidiness is a thing to gate in CI, not to do inside the release.

builds:
  - id: rta
    main: ./cmd/rta
    binary: rta
    env:
      # Static, and deliberately. rta is copied between machines, run from a
      # scratch container, and launched by an MCP client that inherited a
      # different libc than the one it was built against — none of which is a
      # good moment to discover a dynamic link. Nothing here needs cgo: the
      # Landlock path that once did was dropped whole (internal/pluginhost),
      # and the pure-Go resolver is the more predictable one for
      # a tool whose network capabilities are the point.
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      # Keeps the build machine's directory layout out of the artifact. Both
      # smaller and nobody else's business — the same reason the Makefile
      # passes it for an ordinary build.
      - -trimpath
    ldflags:
      # -s -w drop the symbol table and DWARF: about 21 MB of a 71 MB binary,
      # none of which a person running a CLI reads. A panic still prints a
      # full stack with names and line numbers, because that comes from
      # pclntab and pclntab stays.
      #
      # Only symbols that exist. `-X` on a variable a package does not declare
      # is discarded in silence — no warning, exit 0 — so a stamp nobody
      # declared is provenance this file claims and does not deliver. There
      # was a `-X main.date` here doing exactly that. The build date is
      # already in the artifact by a better route: mod_timestamp below comes
      # from the commit, which is what makes two builds of a tag identical.
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.FullCommit}}
    # Stamped from the commit rather than from now(), so two builds of the
    # same tag produce the same bytes. A reproducible artifact is what makes a
    # published digest worth anything.
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: rta
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE*
      # The whole user guide. docs/ holds nothing but user-facing material,
      # so shipping the directory ships a guide rather than a mixture.
      - docs/*.md
      - docs/examples/*

# A .deb and a .rpm beside the tarballs, and deliberately no hosted apt
# repository behind them.
#
# `apt install ./rta_1.2.3_amd64.deb` works from a downloaded file and gets
# the two things a package is actually wanted for: the binary on $PATH
# without anybody untarring into /usr/local, and a package manager that knows
# rta is installed and can remove it. A repository would add unattended
# upgrades, and it would cost a signing key to generate, protect, rotate and
# distribute — key management for a tool whose own argument is that
# authorization must be something you can point at. Not worth it until
# somebody asks for the upgrade path specifically.
#
# The checksums below cover these exactly as they cover the archives, so a
# .deb is verified the same way and by the same command.
nfpms:
  - id: rta
    package_name: rta
    formats: [deb, rpm, apk]
    maintainer: this-is-tobi <this-is-tobi@proton.me>
    description: |-
      One binary over the tools you already juggle, and the layer that decides
      what an AI agent may touch.
      Databases, object storage, secrets, networking, certificates, host
      telemetry and HTTP APIs behind one capability model, rendered as a
      scriptable CLI, an interactive TUI and an MCP server with per-capability,
      time-boxed consent.
    homepage: https://github.com/this-is-tobi/rule-them-all
    license: Apache-2.0
    section: utils
    # No dependencies, no scriptlets and no conffiles: the binary is static
    # (CGO_ENABLED=0 above) and rta creates its own configuration on first
    # use. A package that installs one file is a package that uninstalls
    # cleanly, which is the other half of what people want one for.
    bindir: /usr/bin
    contents:
      - src: ./LICENSE
        dst: /usr/share/doc/rta/LICENSE
      - src: ./README.md
        dst: /usr/share/doc/rta/README.md
      - src: ./docs
        dst: /usr/share/doc/rta/docs
    file_name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Security and correctness
      regexp: '^fix(\(.+\))?:'
      order: 0
    - title: Features
      regexp: '^feat(\(.+\))?:'
      order: 1
    - title: Everything else
      order: 99
  filters:
    exclude:
      - "^test:"
      - "^chore:"
      - "^docs:"

release:
  # Drafted rather than published. A release is the moment a digest-pinning
  # tool's own artifacts become the thing everybody pins, so it gets read
  # before it is public.
  draft: true
  prerelease: auto
  footer: |
    ## Verifying what you just downloaded

    ```
    sha256sum -c checksums.txt --ignore-missing
    ```

    A `.deb`, `.rpm` and `.apk` are published beside the archives. There is no
    package repository: install the file you downloaded and verified —
    `sudo apt install ./rta_{{ .Version }}_linux_amd64.deb` — which is the
    same artifact the checksum above covers.

    Plugins are separate artifacts and are pinned by digest, not by name:
    `rta plugin trust <name>` records the hash of the binary you approved, and
    a replacement with the same name is refused rather than inherited. The
    same reasoning is why the checksums above exist.
